<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CartSum – Know your total before checkout</title>
<meta name="description" content="Add each price as you shop and see your cart total before you reach the checkout. Free, no account, works offline.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#111;--mut:#7a7a74;--line:#e7e7e2;--acc:#c6f432;--dark:#111;--warn:#ffb020;--bad:#ff5a4f}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0c;--card:#181818;--ink:#f2f2ee;--mut:#8d8d86;--line:#262626;--dark:#1d1d1d}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 Inter,"Noto Kufi Arabic",Kufi,system-ui,sans-serif;padding:calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:auto}
[dir=rtl] body{font-family:"Noto Kufi Arabic",Kufi,Inter,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo img{width:32px;height:32px;border-radius:10px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
/* total */
.total{background:var(--dark);color:#fff;border-radius:28px;padding:20px 20px 18px;position:relative;overflow:hidden}
.total:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--acc);opacity:.13;top:-70px;inset-inline-end:-50px}
.total small{color:#b9b9b2;font-size:13px;font-weight:600}
.amt{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;color:var(--acc);margin:4px 0 2px;word-break:break-all}
.sub{display:flex;justify-content:space-between;align-items:center;color:#b9b9b2;font-size:13px}
.budbtn{color:#fff;background:#ffffff1a;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.bar{height:8px;border-radius:8px;background:#ffffff1f;margin-top:12px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;transition:width .35s,background .3s}
.total.has .bar{display:block}
.total.warn .bar i{background:var(--warn)}.total.over .bar i{background:var(--bad)}.total.over .amt{color:#ff8a80}
/* add */
.add{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;margin-top:12px;box-shadow:0 14px 30px -24px #0005}
.row{display:flex;gap:8px;align-items:stretch}
.price{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:16px;padding:0 14px;border:2px solid transparent;transition:border .2s}
.price:focus-within{border-color:var(--ink)}
.price input{flex:1;min-width:0;width:100%;height:58px;font-size:28px;font-weight:700;direction:ltr}
.price input::placeholder{color:#b5b5ae;font-weight:600}
.price .cur{color:var(--mut);font-weight:700;font-size:15px}
.cam{width:58px;border-radius:16px;background:var(--bg);font-size:22px;display:grid;place-items:center}
.row2{display:flex;gap:8px;margin-top:8px}
.name{flex:1;min-width:0;background:var(--bg);border-radius:14px;padding:0 12px;height:46px;font-size:14.5px}
.qty{display:flex;align-items:center;background:var(--bg);border-radius:14px;direction:ltr}
.qty button{width:40px;height:46px;font-size:20px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.go{width:100%;height:58px;margin-top:10px;border-radius:18px;background:var(--acc);color:#111;font-size:18px;font-weight:800;transition:transform .1s,opacity .2s}
.go:active{transform:scale(.98)}.go:disabled{opacity:.45}
/* scan */
.scanbig{width:100%;margin-top:12px;border-radius:24px;background:var(--acc);color:#111;padding:18px;display:flex;align-items:center;gap:14px;text-align:start;box-shadow:0 16px 30px -18px #8fb51f}
.scanbig .ic{width:58px;height:58px;border-radius:18px;background:#111;color:var(--acc);display:grid;place-items:center;font-size:28px;flex:none}
.scanbig b{display:block;font-size:20px;font-weight:800}.scanbig small{display:block;font-size:13px;opacity:.75}
.or{text-align:center;color:var(--mut);font-size:12.5px;font-weight:600;margin:12px 0 -4px}
.camv{position:fixed;inset:0;background:#000;z-index:40;display:none}.camv.on{display:block}
.camv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:8%;right:8%;top:30%;height:24%;border-radius:22px;box-shadow:0 0 0 9999px #000a;border:3px solid var(--acc)}
.frame:after{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:var(--acc);opacity:.6;animation:sc 1.6s ease-in-out infinite alternate}@keyframes sc{from{top:12%}to{top:88%}}
.ctop{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.ctop button{width:44px;height:44px;border-radius:14px;background:#ffffff26;font-size:20px;color:#fff}
.ctot{text-align:end}.ctot small{display:block;font-size:12px;opacity:.8}.ctot b{font-size:30px;font-weight:800;color:var(--acc)}
.hint{position:absolute;top:calc(30% - 44px);left:0;right:0;text-align:center;color:#fff;font-size:14px;font-weight:600}
.res{position:absolute;left:14px;right:14px;top:calc(54% + 16px);background:#fff;color:#111;border-radius:20px;padding:12px 14px;display:none;align-items:center;gap:10px;animation:in .2s ease}
.res.on{display:flex}.res b{flex:1;font-size:22px;font-weight:800}.res button{background:#f0f0ec;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13.5px}
.res.err b{font-size:15px;font-weight:600}
.cbot{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-around;align-items:center}
.cbot .qty{background:#ffffff26;color:#fff;border-radius:14px}
.shut{width:84px;height:84px;border-radius:50%;background:var(--acc);border:6px solid #fff;box-shadow:0 0 0 3px var(--acc)}
.shut:active{transform:scale(.94)}.shut.busy{opacity:.5;animation:pl 1s infinite}@keyframes pl{50%{transform:scale(.92)}}
.cdone{color:#fff;background:#ffffff26;border-radius:14px;padding:12px 16px;font-weight:700}
/* how */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;font-size:12.5px;color:var(--mut);line-height:1.4}
.how b{display:grid;place-items:center;width:26px;height:26px;border-radius:9px;background:var(--acc);color:#111;font-size:13px;margin-bottom:6px}
/* list */
.lh{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px;font-weight:700}
.lh button{font-size:13px;color:var(--mut);font-weight:600}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.it .tx{flex:1;min-width:0}.it .tx b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .tx small{color:var(--mut);font-size:12.5px}
.it .qty{background:var(--bg);border-radius:12px}.it .qty button{width:32px;height:34px;font-size:17px}
.it .p{font-weight:800;font-size:16px;min-width:70px;text-align:end}
.done{width:100%;height:52px;border-radius:18px;background:var(--dark);color:#fff;font-weight:700;margin-top:6px}
.hist{margin-top:18px;color:var(--mut);font-size:13px;text-align:center}
/* sheet */
.mask{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.25s;z-index:9}.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:26px 26px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:10}
.sheet.on{transform:none}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:10px}
.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:600}
.f input,.f select{width:100%;height:50px;background:var(--bg);border-radius:14px;padding:0 12px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,160%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;z-index:20;transition:.3s;white-space:nowrap;opacity:0;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.scan{position:fixed;inset:0;background:#000c;color:#fff;display:none;place-items:center;z-index:30;text-align:center}.scan.on{display:grid}
.spin{width:42px;height:42px;border:4px solid #fff3;border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="icon.svg" alt="">CartSum</div>
  <button class="pill" id="setBtn"><span id="langLbl">EN</span> · <span id="curLbl">USD</span> ▾</button>
</header>

<section class="total" id="tot">
  <small data-t="total">Cart total</small>
  <div class="amt n" id="amt">0.00</div>
  <div class="sub"><span id="cnt">0 items</span><button class="budbtn" id="budBtn">🎯 <span id="budTxt">Set a budget</span></button></div>
  <div class="bar"><i id="barI"></i></div>
</section>

<button class="scanbig" id="scanBig"><span class="ic">📷</span><span><b data-t="scan">Scan prices</b><small data-t="scansub">Point at the price tag – it adds itself</small></span></button>
<p class="or" data-t="or">or type the price</p>
<section class="add">
  <div class="row">
    <label class="price"><input id="pr" inputmode="decimal" autocomplete="off" placeholder="0.00" enterkeyhint="done"><span class="cur n" id="curSym">$</span></label>
  </div>
  <div class="row2">
    <input class="name" id="nm" data-ph="name" placeholder="Item name (optional)" enterkeyhint="done">
    <div class="qty"><button id="qm">−</button><span id="qv">1</span><button id="qp">+</button></div>
  </div>
  <button class="go" id="addBtn" disabled data-t="add">Add to cart</button>
</section>

<section class="how" id="how">
  <div><b>1</b><span data-t="h1">Tap “Scan prices”</span></div>
  <div><b>2</b><span data-t="h2">Point at the price tag and tap</span></div>
  <div><b>3</b><span data-t="h3">Your total adds up by itself</span></div>
</section>

<div id="listWrap" hidden>
  <div class="lh"><span data-t="incart">In your cart</span><button id="clr" data-t="clear">Clear</button></div>
  <div id="list"></div>
  <button class="done" id="doneBtn" data-t="done">✓ Paid – start a new cart</button>
</div>
<p class="hist" id="hist"></p>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3 data-t="settings">Settings</h3>
  <label class="f"><span data-t="lang">Language</span><select id="sLang"></select></label>
  <label class="f"><span data-t="cur">Currency</span><select id="sCur"></select></label>
  <label class="f"><span data-t="budget">Budget for this trip (optional)</span><input id="sBud" inputmode="decimal" placeholder="0"></label>
  <button class="go" id="sSave" data-t="save">Save</button>
</div>
<div class="camv" id="camv"><video id="vid" playsinline muted autoplay></video><div class="frame"></div><p class="hint" data-t="aim">Put the price inside the box</p>
  <div class="ctop"><button id="camX" aria-label="Close">✕</button><div class="ctot"><small data-t="total">Cart total</small><b class="n" id="ctot">0</b></div></div>
  <div class="res" id="res"></div>
  <div class="cbot"><div class="qty"><button id="cqm">−</button><span id="cqv">1</span><button id="cqp">+</button></div><button class="shut" id="shut" aria-label="Scan"></button><button class="cdone" id="camDone" data-t="finish">Done</button></div></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<div class="scan" id="scanning"><div><div class="spin"></div><span data-t="reading">Reading the price…</span></div></div>
<div class="toast" id="toast"></div>

const save=()=>store.set("s",S);
const T=()=>L[S.lang];
const money=v=>{try{return new Intl.NumberFormat(S.lang==="ar"?"ar-MA-u-nu-latn":S.lang,{style:"currency",currency:S.cur,maximumFractionDigits:S.cur==="JPY"?0:2}).format(v)}catch(e){return v.toFixed(2)+" "+S.cur}};
const sym=()=>{try{return new Intl.NumberFormat(S.lang==="ar"?"ar-MA-u-nu-latn":S.lang,{style:"currency",currency:S.cur}).formatToParts(0).find(p=>p.type==="currency").value}catch(e){return S.cur}};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1700)}
let Q=1;
const total=()=>S.items.reduce((a,i)=>a+i.p*i.q,0);
function lang(){const t=T();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  $$("[data-t]").forEach(e=>{const v=t[e.dataset.t];if(typeof v==="string")e.textContent=v});$("#nm").placeholder=t.nameph;$("#langLbl").textContent=S.lang.toUpperCase();$("#curLbl").textContent=S.cur;$("#curSym").textContent=sym()}
function render(){const t=T(),tot=total(),n=S.items.reduce((a,i)=>a+i.q,0);
  $("#amt").textContent=money(tot);$("#cnt").textContent=t.items(n);
  const box=$("#tot");box.classList.toggle("has",S.budget>0);
  if(S.budget>0){const r=tot/S.budget;box.classList.toggle("warn",r>=.85&&r<=1);box.classList.toggle("over",r>1);$("#barI").style.width=Math.min(100,r*100)+"%";
    $("#budTxt").textContent=money(Math.abs(S.budget-tot))+" "+(r>1?t.over:t.left)}else{box.classList.remove("warn","over");$("#budTxt").textContent=t.setb}
  $("#listWrap").hidden=!S.items.length;$("#how").style.display=S.items.length?"none":"";
  $("#list").innerHTML=S.items.map((i,k)=>`<div class="it"><div class="tx"><b>${esc(i.n)||t.item+" "+(k+1)}</b><small class="n">${money(i.p)}${i.q>1?" × "+i.q:""}</small></div><div class="qty"><button data-k="${k}" data-d="-1">−</button><span>${i.q}</span><button data-k="${k}" data-d="1">+</button></div><b class="p n">${money(i.p*i.q)}</b></div>`).reverse().join("");
  const now=new Date(),m=S.hist.filter(h=>{const d=new Date(h.d);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()&&h.c===S.cur}).reduce((a,h)=>a+h.t,0);
  $("#hist").textContent=m>0?t.month(money(m)):"";upd();save()}
function val(){return parseFloat(($("#pr").value||"").replace(",","."))}
function upd(){const v=val();const ok=v>0&&v<1e7;$("#addBtn").disabled=!ok;$("#addBtn").textContent=ok?T().addp(money(v*Q)):T().add;$("#qv").textContent=Q}
$("#pr").oninput=upd;
$("#qm").onclick=()=>{Q=Math.max(1,Q-1);upd()};$("#qp").onclick=()=>{Q++;upd()};
function add(){const v=val();if(!(v>0))return;S.items.push({p:Math.round(v*100)/100,q:Q,n:$("#nm").value.trim()});$("#pr").value="";$("#nm").value="";Q=1;vib();render();
  const r=S.budget?total()/S.budget:0;toast(r>1?T().overT:r>=.85?T().near:T().added);$("#pr").focus()}
$("#addBtn").onclick=add;$("#pr").onkeydown=e=>{if(e.key==="Enter")add()};$("#nm").onkeydown=e=>{if(e.key==="Enter")add()};
$("#list").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;const k=+b.dataset.k;S.items[k].q+=+b.dataset.d;if(S.items[k].q<=0)S.items.splice(k,1);vib();render()};
let c0=0;$("#clr").onclick=()=>{if(Date.now()-c0<3000){S.items=[];c0=0;render();toast(T().cleared)}else{c0=Date.now();toast(T().again)}};
$("#doneBtn").onclick=()=>{const tt=total();S.hist.push({d:Date.now(),t:tt,c:S.cur});S.hist=S.hist.slice(-200);S.items=[];render();toast(T().paid(money(tt)))};
// settings
$("#sLang").innerHTML=Object.entries(L).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("");
$("#sCur").innerHTML=CUR.map(c=>`<option>${c}</option>`).join("");
function openSet(){$("#sLang").value=S.lang;$("#sCur").value=S.cur;$("#sBud").value=S.budget||"";$("#sheet").classList.add("on");$("#mask").classList.add("on")}
const close=()=>{$("#sheet").classList.remove("on");$("#mask").classList.remove("on")};
$("#setBtn").onclick=openSet;$("#budBtn").onclick=openSet;$("#mask").onclick=close;
$("#sSave").onclick=()=>{S.lang=$("#sLang").value;S.cur=$("#sCur").value;S.budget=parseFloat(($("#sBud").value||"").replace(",","."))||0;close();lang();render();toast(T().saved)};
// ---------- price scanner: live camera + OCR (Tesseract), tap and it adds itself ----------
let worker=null,stream=null,CQ=1,last=null;
const loadT=()=>window.Tesseract?Promise.resolve(window.Tesseract):new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>ok(window.Tesseract);s.onerror=no;document.head.appendChild(s)});
async function getWorker(){if(worker)return worker;const Ts=await loadT();worker=await Ts.createWorker("eng");await worker.setParameters({tessedit_pageseg_mode:"11"});return worker}
function ctot(){$("#ctot").textContent=money(total())}
async function openCam(){if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return $("#file").click();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})}catch(e){return $("#file").click()}
  const v=$("#vid");v.srcObject=stream;await v.play().catch(()=>{});CQ=1;$("#cqv").textContent=1;$("#res").className="res";ctot();$("#camv").classList.add("on");getWorker().catch(()=>{})}
function closeCam(){$("#camv").classList.remove("on");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}render()}
$("#scanBig").onclick=openCam;$("#camX").onclick=closeCam;$("#camDone").onclick=closeCam;
$("#cqm").onclick=()=>{CQ=Math.max(1,CQ-1);$("#cqv").textContent=CQ};$("#cqp").onclick=()=>{CQ++;$("#cqv").textContent=CQ};
// source frame: the part of the video inside the green box, or the whole photo
let src=null;
function frameBox(){const v=$("#vid"),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const W=innerWidth,H=innerHeight,sc=Math.max(W/vw,H/vh),ox=(vw*sc-W)/2,oy=(vh*sc-H)/2;
  return {img:v,x:(W*.08+ox)/sc,y:(H*.30+oy)/sc,w:(W*.84)/sc,h:(H*.24)/sc}}
// draw the source at a given height (Tesseract reads best when digits are ~40-60px), optionally inverted for white-on-red promo tags
function draw(b,hgt,inv){const k=hgt/b.h,c=document.createElement("canvas");c.width=Math.round(b.w*k);c.height=hgt;const g=c.getContext("2d");
  g.filter=inv?"grayscale(1) invert(1) contrast(1.6)":"grayscale(1) contrast(1.5)";g.drawImage(b.img,b.x,b.y,b.w,b.h,0,0,c.width,c.height);return c}
async function setMode(w,digits){await w.setParameters(digits?{tessedit_pageseg_mode:"8",tessedit_char_whitelist:"0123456789"}:{tessedit_pageseg_mode:"11",tessedit_char_whitelist:""})}
async function readPrice(b){const w=await getWorker();await setMode(w,false);
  for(const [hgt,inv] of [[120,false],[120,true],[80,false],[80,true],[180,false]]){const c=draw(b,hgt,inv);const best=pick((await w.recognize(c)).data);
    if(!best)continue;
    if(best.dec)return best.v;
    // whole number found: look for small raised cents just right of it (89⁹⁵ -> 89.95)
    const ct=await cents(w,c,best);await setMode(w,false);return ct!=null?parseFloat(best.int+"."+ct):best.v}
  return null}
async function cents(w,c,b){const n=b.int.length;await setMode(w,true);
  for(const k of [.6,.5]){const x=b.x0+n*k*b.h,y=Math.max(0,b.y0-b.h*.15),cw=Math.min(b.h,c.width-x),ch=b.h*.7;if(cw<8)continue;
    const s=document.createElement("canvas");s.width=cw*3;s.height=ch*3;s.getContext("2d").drawImage(c,x,y,cw,ch,0,0,s.width,s.height);
    const t=((await w.recognize(s)).data.text||"").replace(/\D/g,"");if(t.length>=2)return t.slice(-2)}
  return null}
async function shoot(){const btn=$("#shut");if(btn.classList.contains("busy"))return;btn.classList.add("busy");vib();
  try{const b=frameBox();const p=b?await readPrice(b):null;
    if(p){S.items.push({p,q:CQ,n:""});last=S.items.length-1;save();ctot();showRes(p*CQ,CQ);CQ=1;$("#cqv").textContent=1;try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}}
    else showErr(T().closer)}
  catch(e){showErr(T().offline)}
  btn.classList.remove("busy")}
$("#shut").onclick=shoot;
function showRes(v,q){const r=$("#res");r.className="res on";r.innerHTML=`<b class="n">+ ${money(v)}</b><button id="rEdit">✏️</button><button id="rUndo">${T().undo}</button>`;
  $("#rUndo").onclick=()=>{if(last!=null){S.items.splice(last,1);last=null;save();ctot()}r.className="res"};
  $("#rEdit").onclick=()=>{if(last!=null){const it=S.items.splice(last,1)[0];last=null;closeCam();$("#pr").value=it.p;Q=it.q;upd();$("#pr").focus()}}}
function showErr(t){const r=$("#res");r.className="res on err";r.innerHTML=`<b>${t}</b>`}
// photo fallback (when the browser gives no live camera)
$("#file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;$("#scanning").classList.add("on");
  try{const im=await loadImg(f);const p=await readPrice({img:im,x:0,y:0,w:im.width,h:im.height});if(p){S.items.push({p,q:1,n:""});render();toast("+ "+money(p))}else toast(T().nofound)}catch(err){toast(T().offline)}
  $("#scanning").classList.remove("on")};
function loadImg(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(f)})}
// choose the price: the tallest number; "12,99"/"12.99" preferred; neighbouring digit pieces of the same size joined
function pick(d){let ws=(d.words||[]).filter(w=>w.confidence==null||w.confidence>=45).map(w=>({t:(w.text.match(/\d[\d.,]*/)||[""])[0],h:w.bbox.y1-w.bbox.y0,x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0})).filter(w=>/\d/.test(w.t)).sort((a,b)=>a.x0-b.x0);
  for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length;j++){const a=ws[i],b=ws[j];if(Math.abs(a.h-b.h)<a.h*.2&&Math.abs(a.y0-b.y0)<a.h*.3&&b.x0-a.x1<a.h*.35&&b.x0>=a.x1-2){a.t+=b.t;a.x1=b.x1;ws.splice(j,1);j--}}
  let best=null;
  for(const w of ws){const t=w.t.replace(",",".").replace(/^\.+|\.+$/g,"");if(!/^\d{1,5}(\.\d{1,2})?$/.test(t))continue;const v=parseFloat(t);if(!(v>0&&v<1e5))continue;
    const dec=t.includes("."),sc=w.h*(dec?1.5:1);if(!best||sc>best.s)best={v,s:sc,dec,int:t.split(".")[0],x0:w.x0,y0:w.y0,h:w.h}}
  return best}
lang();render();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
